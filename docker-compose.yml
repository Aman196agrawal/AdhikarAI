# Local Postgres for development. Production uses Neon (see .env.example).
# Port 5433 on the host to avoid colliding with an existing local Postgres.
services:
  postgres:
    image: postgres:16-alpine
    container_name: adhikarai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adhikarai
      POSTGRES_PASSWORD: adhikarai_dev
      POSTGRES_DB: adhikarai
    ports:
      - "5433:5432"
    volumes:
      - adhikarai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhikarai -d adhikarai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  adhikarai-pgdata:
